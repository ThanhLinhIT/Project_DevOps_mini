# ──────────────────────────────────────────────────────────────
# Pickleball Court Booking System — Docker Compose
# Services: MongoDB + Backend API + Frontend (Nginx)
# ──────────────────────────────────────────────────────────────

version: "3.8"

services:
  # ── Database ─────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: pickleball-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-admin12345}
      MONGO_INITDB_DATABASE: pickleball
    volumes:
      - mongo_data:/data/db
    networks:
      - pickleball-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pickleball-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_NAME: Pickleball Court Booking System
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-admin12345}@mongodb:27017/pickleball?authSource=admin
      CORS_ORIGIN: "*"
      JWT_SECRET: ${JWT_SECRET:-supersecretkey2026}
      JWT_EXPIRES_IN: 7d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - pickleball-net

  # ── Frontend (Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pickleball-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - pickleball-net

volumes:
  mongo_data:
    driver: local

networks:
  pickleball-net:
    driver: bridge
